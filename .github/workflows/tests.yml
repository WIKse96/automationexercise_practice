name: Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Zainstaluj przeglądarki Playwright (Chromium + Firefox + biblioteki systemowe)
        run: playwright install --with-deps chromium firefox

      - name: Uruchom testy (Chromium + Firefox)
        run: pytest "tests/ui/test_add_to_cart.py::test_view_cart_link_in_modal_shows_added_product[chromium-999]" "tests/ui/test_signup_boundary.py::test_signup_field_long_value_accepted[chromium-255_znakow-name]" "tests/ui/test_signup_boundary.py::test_signup_field_long_value_accepted[chromium-256_znakow-last_name]" "tests/ui/test_signup_boundary.py::test_signup_field_long_value_accepted[chromium-256_znakow-state]" --reruns 2 --reruns-delay 2

      - name: Zapisz raport jako artefakt (nawet jeśli testy padły)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/report.html
            reports/allure_results

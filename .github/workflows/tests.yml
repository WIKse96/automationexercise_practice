name: Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Zainstaluj przeglądarkę Playwright (Chromium + biblioteki systemowe)
        run: playwright install --with-deps chromium

      - name: Uruchom testy
        run: pytest -n 4 --alluredir=reports/allure_results

      - name: Zapisz raport jako artefakt (nawet jeśli testy padły)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/report.html
            reports/allure_results
